<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root{
      --navy:#14213D; --blue:#1F6FEB; --red:#D22128; --green:#009639;
      --bg:#F4F7FB; --card:#FFFFFF; --text:#1B2A41; --muted:#5B6B82; --line:#D5DEEA;
      --code-bg:#0B1F3A; --shadow:0 8px 24px rgba(20,33,61,.12);
    }
    @media (prefers-color-scheme: dark){
      :root{ --bg:#0D1524; --card:#142038; --text:#E6EDF7; --muted:#9FB0C8; --line:#26385A; --shadow:0 8px 24px rgba(0,0,0,.45); }
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);
      font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    img{max-width:100%;height:auto}

    /* Navigation bar */
    .progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:30;
      background:linear-gradient(90deg,var(--red),var(--blue),var(--green))}
    .topbar{position:sticky;top:0;z-index:20;background:var(--navy);box-shadow:0 2px 12px rgba(0,0,0,.25)}
    .topbar .inner{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px}
    .brand{color:#fff;font-weight:700;white-space:nowrap;text-decoration:none;padding:14px 0}
    .nav{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
    .nav::-webkit-scrollbar{display:none}
    .nav a{color:#CFE3FF;text-decoration:none;font-size:14px;padding:14px 10px;border-bottom:3px solid transparent;transition:.2s}
    .nav a:hover{color:#fff;border-bottom-color:var(--blue);background:rgba(255,255,255,.06)}

    /* Page */
    .page{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
    .page > p img[src$="banner.svg"]{border-radius:18px;box-shadow:var(--shadow)}
    h1,h2,h3{line-height:1.25}
    h1{font-size:clamp(2rem,5vw,3rem);margin:.6em 0 .1em;color:var(--navy)}
    h3{color:var(--muted);font-weight:500}
    @media (prefers-color-scheme: dark){ h1{color:#fff} }
    h2{position:relative;font-size:1.7rem;margin:2.2rem 0 1rem;padding-bottom:.4rem;scroll-margin-top:72px}
    h2::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:72px;border-radius:4px;
      background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s}
    h2:hover::after{width:160px}
    hr{border:0;height:1px;background:var(--line);margin:1.6rem 0}
    a{color:var(--blue)}
    a[id]:empty{scroll-margin-top:72px}

    /* Two-column sections: image left, content right */
    table.split{width:100%;border-collapse:separate;border-spacing:0;margin:0 0 1rem;background:var(--card);
      border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:transform .3s,box-shadow .3s}
    table.split:hover{transform:translateY(-2px)}
    table.split > tbody > tr > td{border:0;vertical-align:top;padding:20px}
    table.split > tbody > tr > td.fig{background:linear-gradient(180deg,rgba(31,111,235,.06),rgba(0,150,57,.05))}
    table.split td.fig img{border-radius:14px;box-shadow:var(--shadow);transition:transform .35s,box-shadow .35s}
    table.split td.fig img:hover{transform:scale(1.04)}
    table.split td.fig sub{display:block;margin-top:10px;color:var(--muted);font-size:.82rem;line-height:1.4}
    table.split td.txt > :first-child{margin-top:0} table.split td.txt > :last-child{margin-bottom:0}

    /* Data tables */
    table:not(.split){border-collapse:collapse;width:100%;margin:1rem 0;font-size:.93rem;display:block;overflow-x:auto}
    table:not(.split) th{background:var(--navy);color:#fff;text-align:left}
    table:not(.split) th,table:not(.split) td{padding:8px 12px;border:1px solid var(--line)}
    table:not(.split) tbody tr:nth-child(even){background:rgba(31,111,235,.06)}
    table:not(.split) tbody tr{transition:background .2s} table:not(.split) tbody tr:hover{background:rgba(31,111,235,.14)}

    /* Callouts, details, code, diagrams */
    blockquote{margin:1.2rem 0;padding:14px 18px;border-left:5px solid var(--blue);border-radius:0 12px 12px 0;
      background:var(--card);box-shadow:var(--shadow)}
    blockquote p{margin:0}
    details{margin:1rem 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 16px;box-shadow:var(--shadow)}
    summary{cursor:pointer;padding:12px 0;list-style:none} summary::-webkit-details-marker{display:none}
    summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .2s;color:var(--blue)}
    details[open] > summary::before{transform:rotate(90deg)}
    code{font-family:Consolas,"SFMono-Regular","Courier New",monospace;font-size:.9em;background:rgba(31,111,235,.12);padding:.1em .35em;border-radius:5px}
    pre{background:var(--code-bg);color:#E6EDF7;padding:16px;border-radius:12px;overflow-x:auto;box-shadow:var(--shadow)}
    pre code{background:none;padding:0;color:inherit}
    .highlight .c,.highlight .c1,.highlight .cm{color:#7F8EA3;font-style:italic}
    .highlight .k,.highlight .kd,.highlight .kn,.highlight .nt{color:#FF7B72}
    .highlight .s,.highlight .s1,.highlight .s2,.highlight .sx{color:#A5D6FF}
    .highlight .nb,.highlight .nf,.highlight .nx{color:#D2A8FF}
    .highlight .m,.highlight .mi,.highlight .mf{color:#79C0FF}
    .highlight .na,.highlight .nv{color:#7EE787}
    .mermaid{display:flex;justify-content:center;margin:1.2rem 0;padding:16px;background:var(--card);
      border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-x:auto}
    .mermaid svg{max-width:100%;height:auto}
    a[href="#table-of-contents"]{display:inline-block;font-size:.85rem;text-decoration:none;padding:3px 12px;border:1px solid var(--line);
      border-radius:999px;background:var(--card);transition:.2s} a[href="#table-of-contents"]:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
    ol,ul{padding-left:1.4rem} li{margin:.25rem 0}

    /* Fade-in on scroll (only when JavaScript is available) */
    .js .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
    .js .reveal.in{opacity:1;transform:none}
    @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .js .reveal{opacity:1;transform:none;transition:none} table.split:hover,table.split td.fig img:hover{transform:none} }

    /* Responsive: stack image above content on tablets and phones */
    @media (max-width:820px){
      table.split > tbody, table.split > tbody > tr, table.split > tbody > tr > td{display:block;width:100% !important}
      table.split > tbody > tr > td{padding:16px}
      h2{font-size:1.4rem}
      .brand{display:none}
    }
    footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px 40px}
  </style>
  <script>document.documentElement.className+=' js';</script>
</head>
<body>
  <div class="progress" id="progress"></div>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="#top">Web Servers Explained</a>
      <nav class="nav" aria-label="Sections">
        <a href="#1-introduction">Intro</a>
        <a href="#2-what-is-a-web-server">Web Server</a>
        <a href="#3-how-does-a-web-server-work">How It Works</a>
        <a href="#4-http-and-https">HTTP/HTTPS</a>
        <a href="#5-apache-http-server">Apache</a>
        <a href="#6-nginx">Nginx</a>
        <a href="#7-apache-vs-nginx-comparison">Comparison</a>
        <a href="#8-real-world-applications">Uses</a>
        <a href="#9-conclusion">Conclusion</a>
      </nav>
    </div>
  </header>

  <main class="page" id="top">
    {{ content }}
  </main>

  <footer>&copy; Web Servers Explained: Understanding Apache and Nginx</footer>

  <script>
    // Scroll progress bar
    const bar=document.getElementById('progress');
    addEventListener('scroll',()=>{const h=document.documentElement;
      bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%';},{passive:true});
    // Fade-in sections
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.08});
    document.querySelectorAll('table.split,.mermaid,details,blockquote,pre').forEach(el=>{el.classList.add('reveal');io.observe(el);});
  </script>

  <!-- Mermaid.js: converts the ```mermaid code blocks into rendered diagrams -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.esm.min.mjs';
    const blocks=new Set();
    document.querySelectorAll('pre code.language-mermaid, div.language-mermaid').forEach(el=>{
      blocks.add(el.closest('div.language-mermaid')||el.closest('pre'));
    });
    blocks.forEach(b=>{
      const d=document.createElement('div');
      d.className='mermaid';
      d.textContent=b.querySelector('code').textContent;
      b.replaceWith(d);
    });
    const dark=matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({startOnLoad:false,theme:dark?'dark':'default',securityLevel:'strict',flowchart:{useMaxWidth:true,htmlLabels:true}});
    await mermaid.run({querySelector:'.mermaid'});
  </script>
</body>
</html>
